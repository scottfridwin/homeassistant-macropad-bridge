name: Build, Test & Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  # No paths-ignore: "Test" is a required check and must report on every PR
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.2.0). Leave empty to only build and publish :main."
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homeassistant-macropad-bridge
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  # ----------------------------------------------------------
  # Lint: ruff (pycodestyle, pyflakes, bugbear, bandit, ...) and formatting
  # ----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ruff
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt

      - name: Lint
        run: .venv/bin/ruff check --output-format=github .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

  # ----------------------------------------------------------
  # Test: run the unit tests inside the image on every platform
  # ----------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Shared runners hit Docker Hub's anonymous pull limit (HTTP 429)
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build and test all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: test
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # Publish: push :main and :sha-<commit> for every build of main
  # ----------------------------------------------------------
  publish:
    name: Publish image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ----------------------------------------------------------
  # Release check: release when a merge to main changes the image
  # ----------------------------------------------------------
  release-check:
    name: Release check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      bump: ${{ steps.check.outputs.bump }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Decide
        id: check
        run: |
          CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          SUBJECT="$(git log -1 --format=%s)"
          BODY="$(git log -1 --format=%b)"
          echo "Subject: ${SUBJECT}"
          echo "Changed files:"; echo "${CHANGED}"
          if grep -qE '^(Dockerfile|requirements\.txt|macropad_bridge\.py|healthcheck\.py)$' <<< "$CHANGED"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          # Conventional commit subject decides the bump; anything else (e.g. Renovate) is a patch
          if [[ "$SUBJECT" =~ ^[a-z]+(\([^\)]*\))?!: ]] || grep -q '^BREAKING CHANGE' <<< "$BODY"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif [[ "$SUBJECT" =~ ^feat(\([^\)]*\))?: ]]; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------
  # Release: tag the exact image published above and create a GitHub release
  # ----------------------------------------------------------
  release:
    name: Release
    if: >-
      !cancelled() && needs.publish.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
        needs.release-check.outputs.release == 'true'
      )
    needs: [publish, release-check]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          VERSION_TAG: ${{ github.event.inputs.release_tag }}
          BUMP: ${{ needs.release-check.outputs.bump }}
        run: |
          if [[ -z "$VERSION_TAG" ]]; then
            LATEST=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            IFS=. read -r MAJ MIN PAT <<< "${LATEST:-0.0.0}"
            case "$BUMP" in
              major) VERSION_TAG="v$((MAJ + 1)).0.0" ;;
              minor) VERSION_TAG="v${MAJ}.$((MIN + 1)).0" ;;
              *)     VERSION_TAG="v${MAJ}.${MIN}.$((PAT + 1))" ;;
            esac
            echo "Auto release (${BUMP}): v${LATEST} -> ${VERSION_TAG}"
          elif [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like v1.2.3 (got ${VERSION_TAG})"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION_TAG}" >/dev/null; then
            echo "::error::Tag ${VERSION_TAG} already exists"
            exit 1
          fi
          echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          VERSION="${TAG#v}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${VERSION%.*}" \
            -t "${IMAGE}:${VERSION%%.*}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"

      - name: Create git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Write release notes header
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          {
            echo '```sh'
            echo "docker pull ${IMAGE}:${TAG#v}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } > "${RUNNER_TEMP}/notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          make_latest: true

  # ----------------------------------------------------------
  # Notify: bot-triggered runs on main email nobody, so open an issue
  # ----------------------------------------------------------
  notify-failure:
    name: Notify failure
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, publish, release-check, release]
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TITLE="CI failed on main"
          BODY="Run: ${RUN_URL}
          Commit: ${GITHUB_SHA::7} $(head -1 <<< "$COMMIT_MSG")"
          EXISTING=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "$OWNER"
          fi
